<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayFísica</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
<style>
*{padding:0;margin:0;box-sizing:border-box;font-family:'Raleway',sans-serif;}
body{background:#f7f7f7;color:#111;}
.tela{width:100vw;height:100vh;display:flex;}
.barra-lateral{width:25%;height:100%;background:#1e1e1e;display:flex;flex-direction:column;align-items:center;padding:1rem;overflow-y:auto;}
.barra-lateral h2{color:#ff9100;margin-bottom:1rem;}
.aula{background:#333;padding:.8rem;width:100%;text-align:center;margin-bottom:.7rem;border-radius:8px;cursor:pointer;transition:background .3s;color:#fff;}
.aula:hover{background:#ff9100;}
.principal{width:75%;height:100%;display:flex;flex-direction:column;background:#f7f7f7;color:#111;}
.video{flex:1;display:flex;justify-content:center;align-items:center;overflow:hidden;padding:1rem 0;background:#000;}
.video-container{width:100%;max-width:900px;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 5px 15px rgba(0,0,0,.4);}
.video-container iframe{width:100%;height:100%;border:none;display:block;}
.botoes-container{display:flex;justify-content:center;gap:1rem;margin-bottom:3rem;margin-top: 3rem ;}
.botao{padding:10px 20px;background:#ff9100;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;transition:.3s;}
.botao:hover{background:#ff9100;}
</style>
</head>

<body>
<div class="tela">
    <div class="barra-lateral">
        <h2>Aulas</h2>
        <div class="aula">1º Lei de Newton no P5.js</div>
        <div class="aula">Exercício 14</div>
        <div class="aula">2º Lei de Newton no P5.js</div>
    </div>

    <div class="principal">
        <div class="video">
            <div class="video-container">
                <iframe src="" title="YouTube" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
        <div class="botoes-container" id="botoes"></div>
    </div>
</div>

<script>
const aulas = [
    { video:"https://www.youtube.com/embed/GT5JRtmZQ_U", resumo:"img/Resumo/3/1.html", exercicio:null, resposta:null },
    { video:"https://www.youtube.com/embed/UNPPgKmpFnA", resumo:null, exercicio:"animations/14/14.html", resposta:"animations/14/code14.png" },
    { video:"https://www.youtube.com/embed/tIfvN0NnYMg", resumo:"img/Resumo/3/2.html", exercicio:null, resposta:null }
];

const videoIframe = document.querySelector(".video-container iframe");
const botoesContainer = document.getElementById("botoes");
const aulasBtns = document.querySelectorAll(".barra-lateral .aula");

function criarBotao(texto, acao) {
    if(!texto) return; // não cria se for null
    const btn = document.createElement("button");
    btn.className = "botao";
    btn.textContent = texto;
    btn.onclick = acao;
    botoesContainer.appendChild(btn);
}

// Função para carregar uma aula por índice
function carregarAula(index){
    const aula = aulas[index];
    if(!aula) return;
    videoIframe.src = aula.video;
    botoesContainer.innerHTML = "";
    if(aula.resumo){
        criarBotao("Resumo", ()=>{ if(aula.resumo) window.open(aula.resumo,"_blank"); });
    }
    if(aula.exercicio){
        criarBotao("Exercício", ()=>{ if(aula.exercicio) window.open(aula.exercicio,"_blank"); });
    }
    if(aula.resposta){
        criarBotao("Resposta", ()=>{ if(aula.resposta) window.open(aula.resposta,"_blank"); });
    }
    
    
}

// Eventos de clique nas aulas
aulasBtns.forEach((btn,index)=>{
    btn.addEventListener("click", ()=>{ carregarAula(index); });
});

// Carrega automaticamente a Aula 1 ao abrir a página
carregarAula(0);
</script>
</body>
</html>
